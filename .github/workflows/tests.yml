name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24.x"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and run unit tests
        run: npm run check

      - name: Verify npm publication gates
        run: npm exec --yes --package=npm@11.5.1 -- npm run test:publishing

      - name: Typecheck Paseo 0.12 compatibility
        run: npm run typecheck:paseo-012

      - name: Typecheck Paseo 0.13 compatibility
        run: npm run typecheck:paseo-013

      - name: Verify browser dependencies
        run: |
          google-chrome --version
          xvfb-run --auto-servernum npx --no-install cypress verify

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify production package and run Cypress integration tests
        run: xvfb-run --auto-servernum npm run test:package -- --integration

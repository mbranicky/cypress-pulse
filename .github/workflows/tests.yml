name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CYPRESS_PULSE_TEST_BROWSER: ${{ runner.temp }}/pulse-chrome/chrome-linux64/chrome
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24.x"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and run unit tests
        run: npm run check

      - name: Verify npm publication gates
        run: npm exec --yes --package=npm@11.5.1 -- npm run test:publishing

      - name: Typecheck Paseo 0.12 compatibility
        run: npm run typecheck:paseo-012

      - name: Typecheck Paseo 0.13 compatibility
        run: npm run typecheck:paseo-013

      - name: Typecheck Paseo 0.14 compatibility
        run: npm run typecheck:paseo-014

      - name: Typecheck Paseo 0.15 compatibility
        run: npm run typecheck:paseo-015

      - name: Typecheck Paseo 0.16 compatibility
        run: npm run typecheck:paseo-016

      - name: Typecheck Paseo 0.17 compatibility
        run: npm run typecheck:paseo-017

      - name: Typecheck Paseo 0.18 compatibility
        run: npm run typecheck:paseo-018

      # Cypress 16.1.1 fails before tests start with the runner's Chrome 158.
      # Keep Chromium-specific screenshot-scale coverage on a known compatible build.
      - name: Install pinned Chrome for Testing
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/linux64/chrome-linux64.zip \
            --output "$RUNNER_TEMP/pulse-chrome.zip"
          unzip -q "$RUNNER_TEMP/pulse-chrome.zip" -d "$RUNNER_TEMP/pulse-chrome"

      - name: Verify browser dependencies
        run: |
          "$CYPRESS_PULSE_TEST_BROWSER" --version
          xvfb-run --auto-servernum npx --no-install cypress verify

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify production package and run Cypress integration tests
        run: xvfb-run --auto-servernum npm run test:package -- --integration
